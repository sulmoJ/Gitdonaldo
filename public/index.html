<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gitdonaldo</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand"><span class="logo">🔀</span> Gitdonaldo</div>
    <div id="repoinfo" class="repoinfo">loading…</div>
    <div class="repopick">
      <input id="repoInput" type="text" placeholder="repo 경로 입력 후 Enter" />
      <button id="refreshBtn" title="새로고침">⟳</button>
    </div>
  </header>

  <main id="layout">
    <aside id="sidebar">
      <section>
        <h3>WORKING DIR</h3>
        <div id="status" class="status">—</div>
      </section>
      <section>
        <h3>LOCAL <span class="pill" id="localCount">0</span></h3>
        <ul id="localRefs" class="reflist"></ul>
      </section>
      <section>
        <h3>REMOTE <span class="pill" id="remoteCount">0</span></h3>
        <ul id="remoteRefs" class="reflist"></ul>
      </section>
      <section>
        <h3>TAGS <span class="pill" id="tagCount">0</span></h3>
        <ul id="tagRefs" class="reflist"></ul>
      </section>
    </aside>

    <section id="graphpane">
      <div id="graphScroll">
        <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
        <ul id="commitList"></ul>
      </div>
    </section>

    <aside id="detail">
      <div id="detailEmpty" class="empty">커밋을 선택하세요</div>
      <div id="detailBody" hidden></div>
    </aside>
  </main>

  <footer id="statusbar">
    <span id="sbLeft">—</span>
    <span id="sbRight">Gitdonaldo</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
