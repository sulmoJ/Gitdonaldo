<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gitdonaldo</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand"><span class="logo">🔀</span> Gitdonaldo</div>
    <div id="repoinfo" class="repoinfo">loading…</div>
    <div id="remotebar" class="remotebar" hidden>
      <button id="fetchBtn" class="tb" title="모든 원격 브랜치 가져오기 (git fetch --prune)">⇣ Fetch</button>
      <button id="pullBtn" class="tb" title="upstream에서 pull">⇩ Pull <span id="behindBadge" class="badge" hidden></span></button>
      <span class="split">
        <button id="pushBtn" class="tb" title="upstream으로 push">⇧ Push <span id="aheadBadge" class="badge" hidden></span></button><button id="pushMoreBtn" class="tb more" title="push 옵션">▾</button>
      </span>
    </div>
    <div class="repopick">
      <button id="openBtn" title="폴더 열기" hidden>📂 열기</button>
      <input id="repoInput" type="text" placeholder="repo 경로 입력 후 Enter" />
      <button id="refreshBtn" title="새로고침">⟳</button>
    </div>
  </header>

  <div id="opBanner" class="op-banner" hidden>
    <span id="opText"></span>
    <span class="op-actions">
      <button id="opContinueBtn" class="btn primary">계속 (Continue)</button>
      <button id="opAbortBtn" class="btn danger">중단 (Abort)</button>
    </span>
  </div>

  <main id="layout">
    <aside id="sidebar">
      <section>
        <h3>WORKING DIR</h3>
        <div id="status" class="status clickable" title="변경 사항 패널 열기/닫기">—</div>
      </section>
      <section class="sec" data-sec="local">
        <h3 class="sec-toggle" role="button" tabindex="0" aria-expanded="false"><span class="caret">▸</span>LOCAL <span class="pill" id="localCount">0</span></h3>
        <ul id="localRefs" class="reflist"></ul>
      </section>
      <section class="sec" data-sec="remote">
        <h3 class="sec-toggle" role="button" tabindex="0" aria-expanded="false"><span class="caret">▸</span>REMOTE <span class="pill" id="remoteCount">0</span></h3>
        <ul id="remoteRefs" class="reflist"></ul>
      </section>
      <section class="sec" data-sec="tag">
        <h3 class="sec-toggle" role="button" tabindex="0" aria-expanded="false"><span class="caret">▸</span>TAGS <span class="pill" id="tagCount">0</span></h3>
        <ul id="tagRefs" class="reflist"></ul>
      </section>
      <section class="sec" data-sec="stash">
        <h3 class="sec-toggle" role="button" tabindex="0" aria-expanded="false"><span class="caret">▸</span>STASHES <span class="pill" id="stashCount">0</span></h3>
        <ul id="stashList" class="reflist"></ul>
      </section>
    </aside>
    <div class="splitter col" data-split="sidebar" title="드래그: 폭 조절 · 더블클릭: 기본값"></div>

    <section id="graphpane">
      <div id="focusBar" class="focus-bar" hidden>
        <span class="focus-dot"></span><span id="focusText"></span>
        <button id="focusClearBtn" class="btn small" title="강조 해제 (Esc)">해제 ✕</button>
      </div>
      <div id="graphScroll">
        <div id="refColSplit" class="splitter refcol" data-split="refcol" title="드래그: 브랜치/태그 컬럼 폭 조절 · 더블클릭: 기본값"></div>
        <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
        <ul id="commitList"></ul>
      </div>

      <div id="workSplit" class="splitter row" data-split="work" title="드래그: 높이 조절 · 더블클릭: 기본값" hidden></div>
      <section id="workArea" hidden>
        <div class="wa-head">
          <b>변경 사항</b>
          <span id="waSummary" class="dim"></span>
          <button id="waCloseBtn" class="icon" title="닫기">✕</button>
        </div>
        <div class="wa-grid">
          <div class="wa-col">
            <div class="wa-col-head">
              <span>Unstaged <span class="pill" id="unstagedCount">0</span></span>
              <span class="wa-col-actions">
                <button id="discardAllBtn" class="btn small danger-text" title="작업 트리 변경 모두 버리기">모두 버리기</button>
                <button id="stageAllBtn" class="btn small">모두 스테이징</button>
              </span>
            </div>
            <ul id="unstagedList" class="filelist"></ul>
          </div>
          <div class="splitter col" data-split="waLeft" title="드래그: 폭 조절 · 더블클릭: 기본값"></div>
          <div class="wa-col">
            <div class="wa-col-head">
              <span>Staged <span class="pill" id="stagedCount">0</span></span>
              <span class="wa-col-actions">
                <button id="unstageAllBtn" class="btn small">모두 내리기</button>
              </span>
            </div>
            <ul id="stagedList" class="filelist"></ul>
          </div>
          <div class="splitter col" data-split="waCommit" title="드래그: 폭 조절 · 더블클릭: 기본값"></div>
          <div class="wa-commit">
            <textarea id="commitMsg" placeholder="커밋 메시지 (첫 줄은 제목)&#10;Ctrl/Cmd+Enter로 커밋" spellcheck="false"></textarea>
            <input id="coAuthors" type="text" placeholder="Co-author: 이름 &lt;email&gt;, …" spellcheck="false" />
            <label class="chk"><input id="amendChk" type="checkbox" /> 마지막 커밋 수정 (amend)</label>
            <div class="wa-commit-actions">
              <button id="stashBtn" class="btn" title="변경 사항을 stash에 넣기">Stash…</button>
              <button id="commitBtn" class="btn primary">Commit</button>
            </div>
          </div>
        </div>
      </section>
    </section>
    <div class="splitter col" data-split="detail" title="드래그: 폭 조절 · 더블클릭: 기본값"></div>

    <aside id="detail">
      <div id="detailEmpty" class="empty">커밋을 선택하세요</div>
      <div id="detailBody" hidden></div>
    </aside>
  </main>

  <footer id="statusbar">
    <span id="sbLeft">—</span>
    <span id="sbRight">Gitdonaldo</span>
  </footer>

  <div id="ctxMenu" class="ctx-menu" role="menu" hidden></div>
  <div id="modalRoot" class="modal-root" hidden>
    <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
